name: CI

on:
  push:
    branches:
      - main
      - 'teste/**'
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 1
            shards: 1
          - os: windows-latest
            shard: 1
            shards: 5
          - os: windows-latest
            shard: 2
            shards: 5
          - os: windows-latest
            shard: 3
            shards: 5
          - os: windows-latest
            shard: 4
            shards: 5
          - os: windows-latest
            shard: 5
            shards: 5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: matrix.shard == 1
        run: npm run typecheck
      - if: matrix.shard == 1
        run: npm run lint
      - run: npm run build:plugin
      - if: runner.os == 'Windows'
        run: node plugin/server.mjs --prepare-windows-runtime
        env:
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/black-gravity-node-cache
      - if: runner.os == 'Windows' && matrix.shard == 1
        run: node --test --test-name-pattern="Windows executor stages real Git inside LPAC" dist/tests/windows-executor.test.js
        env:
          BRIDGE_WINDOWS_NODE_RUNTIME: portable
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/black-gravity-node-cache
      - if: runner.os == 'Windows'
        run: node scripts/test-shard.mjs ${{ matrix.shard }} ${{ matrix.shards }}
        env:
          BRIDGE_WINDOWS_NODE_RUNTIME: portable
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/black-gravity-node-cache
      - if: runner.os != 'Windows'
        run: node scripts/test-shard.mjs ${{ matrix.shard }} ${{ matrix.shards }}
      - if: matrix.shard == 1
        run: npm run test:package
        env:
          BRIDGE_WINDOWS_NODE_CACHE_DIRECTORY: ${{ runner.temp }}/black-gravity-node-cache

  linux-bwrap:
    name: linux-bwrap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Bubblewrap and permit unprivileged userns via targeted AppArmor profile
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor (kernel.apparmor_restrict_unprivileged_userns=1);
        # grant userns specifically to /usr/bin/bwrap instead of weakening the host-wide sysctl.
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --version
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/linux-executor.test.js
        env:
          BLACK_GRAVITY_REQUIRE_BWRAP: '1'
